# @package _global_

defaults:
  - /conf_fullbody_gmr
  - _self_

hydra:
  job:
    env_set:
      MUSCLEMIMIC_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/BadmintonMimic/data/amass_npz
      AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/BadmintonMimic/data/amass_npz
      MUSCLEMIMIC_CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/caches/AMASS
      CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/caches/AMASS
      MUSCLEMIMIC_SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp

wandb:
  project: "musclemimic"
  mode: "online"
  tags: ["fullbody", "gmr", "forehand_clear", "10trajectories", "smooth_filtered", "a100"]

experiment:
  env_params:
    env_name: MjxMyoFullBody
    num_envs: 4096
    disable_fingers: true

  total_timesteps: 1024000000

  ppo_config:
    num_steps: 32
    update_epochs: 2
    num_minibatches: 128

  adaptive_sampling:
    enabled: true
    floor_mix: 0.2

  asi:
    enabled: true
    uniform_mix: 0.2
    alpha: 0.02

  reward_curriculum:
    enabled: true

  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: null
        rel_dataset_path:
          - "10trajectories/video1_lower_body_full_poses"
          - "10trajectories/video2_lower_body_full_poses"
          - "10trajectories/video3_lower_body_full_poses"
          - "10trajectories/video4_lower_body_full_poses"
          - "10trajectories/video5_lower_body_full_poses"
          - "10trajectories/video6_lower_body_full_poses"
          - "10trajectories/video7_lower_body_full_poses"
          - "10trajectories/video8_lower_body_full_poses"
          - "10trajectories/video9_lower_body_full_poses"
          - "10trajectories/video10_lower_body_full_poses"
        retargeting_method: gmr
        clear_cache: false
        gmr_config:
          src_human: smplh
          target_fps: 60
          solver: daqp
          damping: 1.0
          offset_to_ground: false
          use_velocity_limit: true
          use_fitted_shape: true
          shape_fitting_iterations: 500
          ik_config_path: "loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json"

  validation:
    active: true
    deterministic: false
    num_steps: 500
    num_envs: 10
    num: 10
    amass_dataset_conf:
      dataset_group: null
      rel_dataset_path:
        - "10trajectories/video1_lower_body_full_poses"
        - "10trajectories/video2_lower_body_full_poses"
        - "10trajectories/video3_lower_body_full_poses"
        - "10trajectories/video4_lower_body_full_poses"
        - "10trajectories/video5_lower_body_full_poses"
        - "10trajectories/video6_lower_body_full_poses"
        - "10trajectories/video7_lower_body_full_poses"
        - "10trajectories/video8_lower_body_full_poses"
        - "10trajectories/video9_lower_body_full_poses"
        - "10trajectories/video10_lower_body_full_poses"
      retargeting_method: gmr
      clear_cache: false
      gmr_config:
        src_human: smplh
        target_fps: 60
        solver: daqp
        damping: 1.0
        offset_to_ground: false
        use_velocity_limit: true
        use_fitted_shape: true
        shape_fitting_iterations: 500
        ik_config_path: "loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json"
