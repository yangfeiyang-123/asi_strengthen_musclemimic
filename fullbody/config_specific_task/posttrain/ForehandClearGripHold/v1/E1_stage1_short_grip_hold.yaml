# @package _global_

defaults:
- /conf_fullbody_gmr
- _self_
hydra:
  job:
    env_set:
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
wandb:
  project: musclemimic
  mode: online
  tags:
  - fullbody
  - gmr
  - badminton
  - ForehandClearGripHold
  - posttrain
  - E1_stage1_short_grip_hold
experiment:
  env_params:
    env_name: MjxMyoFullBody
    num_envs: 4096
    disable_fingers: true
    goal_params:
      include_current_root_error: false
    reward_params:
      qpos_w_sum: 0.05
      qvel_w_sum: 0.08
      root_pos_w_sum: 0.35
      root_vel_w_sum: 0.25
      rpos_w_sum: 0.3
      rquat_w_sum: 0.01
      rvel_w_sum: 0.06
      absolute_site_reward_sites:
      - right_hand_mimic
      absolute_site_w_sum: 0.1
      absolute_site_w_exp: 10.0
      mimic: 1.0
      root_stability: 1.0
      grip_site: 8.0
      contact: 2.0
      no_slip: 8.0
      no_penetration: 10.0
      racket_hand_pose: 4.0
      residual_effort: 0.01
    terminal_state_type: MeanRelativeSiteDeviationWithRootTerminalStateHandler
    terminal_state_params:
      mean_site_deviation_threshold: 0.45
      root_deviation_threshold: 0.3
      root_orientation_threshold: 0.7
      enable_site_check: true
  checkpoint_root: /data3/yangfeiyang/WorkSpace/musclemimic/outputs/posttrain/ForehandClearGripHold/v1/checkpoints/E1_stage1_short_grip_hold
  resume_from: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/de63059b16c0/checkpoint_7812
  reset_lr_schedule_on_resume: true
  reset_logging_timestep: false
  lr: 5.0e-05
  total_timesteps: 200000000
  ppo_config:
    num_steps: 64
    update_epochs: 2
    num_minibatches: 128
    init_std: 1.0
    ent_coef: 0.0
  adaptive_sampling:
    enabled: false
  adaptive_termination:
    enabled: false
  reward_curriculum:
    enabled: false
  asi:
    enabled: false
  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: null
        rel_dataset_path:
        - forehand_clear/stage5_10demo/video1_lower_body_full_poses
        retargeting_method: gmr
        clear_cache: false
        gmr_config:
          src_human: smplh
          target_fps: 100
          solver: daqp
          damping: 1.0
          offset_to_ground: false
          use_velocity_limit: true
          use_fitted_shape: true
          shape_fitting_iterations: 500
          ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json
  validation:
    active: true
    deterministic: true
    num_steps: 500
    num_envs: 8
    num: 8
    video_length: 500
    video_frequency: 1
    start_from_beginning: false
    terminal_state_type: MeanRelativeSiteDeviationWithRootTerminalStateHandler
    terminal_state_params:
      mean_site_deviation_threshold: 0.45
      root_deviation_threshold: 0.3
      root_orientation_threshold: 0.7
      enable_site_check: true
    amass_dataset_conf:
      dataset_group: null
      rel_dataset_path:
      - forehand_clear/stage5_10demo/video2_lower_body_full_poses
      retargeting_method: gmr
      clear_cache: false
      gmr_config:
        src_human: smplh
        target_fps: 100
        solver: daqp
        damping: 1.0
        offset_to_ground: false
        use_velocity_limit: true
        use_fitted_shape: true
        shape_fitting_iterations: 500
        ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json
