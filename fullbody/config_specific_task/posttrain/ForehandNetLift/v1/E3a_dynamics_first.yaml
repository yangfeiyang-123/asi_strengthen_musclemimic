# @package _global_

defaults:
- /conf_fullbody_gmr
- _self_
hydra:
  job:
    env_set:
      MUSCLEMIMIC_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/amass_npz
      AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/amass_npz
      MUSCLEMIMIC_CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/gmr_cache
      CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/gmr_cache
      MUSCLEMIMIC_GMR_CACHE_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/gmr_cache
      MUSCLEMIMIC_SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
wandb:
  project: musclemimic
  mode: online
  tags:
  - fullbody
  - gmr
  - badminton
  - ForehandNetLift
  - posttrain
  - E3a_dynamics_first
experiment:
  env_params:
    env_name: MjxMyoFullBody
    num_envs: 4096
    disable_fingers: true
    goal_params:
      include_current_root_error: false
    reward_params:
      qpos_w_sum: 0.04
      qvel_w_sum: 0.28
      root_pos_w_sum: 0.2
      root_vel_w_sum: 0.34
      rpos_w_sum: 0.28
      rquat_w_sum: 0.08
      rvel_w_sum: 0.14
      absolute_site_reward_sites:
      - right_hand_mimic
      absolute_site_w_sum: 0.01
      absolute_site_w_exp: 6.0
    terminal_state_type: MeanRelativeSiteDeviationWithRootTerminalStateHandler
    terminal_state_params:
      mean_site_deviation_threshold: 0.55
      root_deviation_threshold: 0.38
      root_orientation_threshold: 0.9
      enable_site_check: true
  checkpoint_root: /data3/yangfeiyang/WorkSpace/musclemimic/outputs/posttrain/ForehandNetLift/v1/checkpoints/E3a_dynamics_first
  resume_from: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/ForehandNetLift/forehand_net_lift_best_asi_curriculum/checkpoint_7812
  reset_lr_schedule_on_resume: true
  reset_logging_timestep: false
  lr: 1.0e-06
  total_timesteps: 100000000
  ppo_config:
    num_steps: 64
    update_epochs: 2
    num_minibatches: 128
    init_std: 0.35
    ent_coef: 0.0
  adaptive_sampling:
    enabled: false
  adaptive_termination:
    enabled: false
  reward_curriculum:
    enabled: false
  asi:
    enabled: false
  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: null
        rel_dataset_path:
        - ForehandNetLift/best/video05_best_stage7_smpl
        - ForehandNetLift/best/video06_best_stage7_smpl
        - ForehandNetLift/best/video07_best_stage5_smpl
        - ForehandNetLift/best/video08_best_stage5_smpl
        retargeting_method: gmr
        clear_cache: false
        gmr_config:
          src_human: smplh
          target_fps: 100
          solver: daqp
          damping: 1.0
          offset_to_ground: false
          use_velocity_limit: true
          use_fitted_shape: true
          shape_fitting_iterations: 500
          ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json
  validation:
    active: true
    deterministic: true
    num_steps: 500
    num_envs: 8
    num: 8
    video_length: 500
    video_frequency: 1
    start_from_beginning: true
    terminal_state_type: MeanRelativeSiteDeviationWithRootTerminalStateHandler
    terminal_state_params:
      mean_site_deviation_threshold: 0.45
      root_deviation_threshold: 0.3
      root_orientation_threshold: 0.7
      enable_site_check: true
    amass_dataset_conf:
      dataset_group: null
      rel_dataset_path:
      - ForehandNetLift/best/video01_best_stage7_smpl
      - ForehandNetLift/best/video03_best_stage7_smpl
      retargeting_method: gmr
      clear_cache: false
      gmr_config:
        src_human: smplh
        target_fps: 100
        solver: daqp
        damping: 1.0
        offset_to_ground: false
        use_velocity_limit: true
        use_fitted_shape: true
        shape_fitting_iterations: 500
        ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json
  reset_std_on_resume: 0.15
