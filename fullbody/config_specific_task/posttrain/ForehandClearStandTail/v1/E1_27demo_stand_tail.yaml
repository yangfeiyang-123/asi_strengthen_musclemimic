# @package _global_

defaults:
- /conf_fullbody_gmr
- _self_

hydra:
  job:
    env_set:
      MUSCLEMIMIC_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/BadmintonMimic/data/amass_npz
      AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/BadmintonMimic/data/amass_npz
      MUSCLEMIMIC_CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/caches/AMASS
      CONVERTED_AMASS_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/caches/AMASS
      MUSCLEMIMIC_SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      SMPL_MODEL_PATH: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'

wandb:
  project: musclemimic
  mode: online
  tags:
  - fullbody
  - gmr
  - forehand_clear
  - 27videos
  - stand_tail
  - posttrain

experiment:
  env_params:
    env_name: MjxMyoFullBody
    num_envs: 4096
    disable_fingers: true
    horizon: 1000
    goal_params:
      include_current_root_error: false
      n_step_lookahead: 5
      n_step_stride: 20
    reward_params:
      qpos_w_sum: 0.08
      qvel_w_sum: 0.18
      root_pos_w_sum: 0.20
      root_vel_w_sum: 0.35
      rpos_w_sum: 0.52
      rquat_w_sum: 0.01
      rvel_w_sum: 0.16
      absolute_site_reward_sites:
      - pelvis_mimic
      - left_ankle_mimic
      - left_toes_mimic
      - right_ankle_mimic
      - right_toes_mimic
      absolute_site_w_sum: 0.12
      absolute_site_w_exp: 12.0
      action_rate_coeff: 0.002
      activation_energy_coeff: 0.0001
    terminal_state_type: MeanRelativeSiteDeviationWithRootTerminalStateHandler
    terminal_state_params:
      mean_site_deviation_threshold: 0.55
      root_deviation_threshold: 0.35
      root_orientation_threshold: 0.75
      enable_site_check: true

  checkpoint_root: /data3/yangfeiyang/WorkSpace/musclemimic/outputs/posttrain/ForehandClearStandTail/v1/checkpoints/E1_27demo_stand_tail
  resume_from: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/999d68245dd4/checkpoint_7812
  reset_lr_schedule_on_resume: true
  reset_logging_timestep: false
  lr: 5.0e-05
  total_timesteps: 300000000

  ppo_config:
    num_steps: 64
    update_epochs: 2
    num_minibatches: 128
    init_std: 1.5
    ent_coef: 0.0

  adaptive_sampling:
    enabled: true
    floor_mix: 0.25
    alpha: 1.0

  asi:
    enabled: true
    num_buckets: 12
    min_remaining_steps: 160
    uniform_mix: 0.25
    alpha: 0.02
    early_termination_penalty: 1.0

  adaptive_termination:
    enabled: true
    init_threshold: 0.55
    min_threshold: 0.25
    low_band: 0.08
    high_band: 0.20
    adjust_factor: 0.96
    consecutive_k: 5
    ema_alpha: 0.1

  reward_curriculum:
    enabled: true
    qvel_w_sum_init: 0.18
    root_vel_w_sum_init: 0.35
    qvel_w_sum_max: 0.28
    root_vel_w_sum_max: 0.45
    eta: 0.015
    ema_alpha: 0.2
    term_rate_threshold: 0.08
    consecutive_k: 5

  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: null
        rel_dataset_path:
        - 10trajectories_smooth/video1_lower_body_full_poses
        - 10trajectories_smooth/video2_lower_body_full_poses
        - 10trajectories_smooth/video3_lower_body_full_poses
        - 10trajectories_smooth/video4_lower_body_full_poses
        - 10trajectories_smooth/video5_lower_body_full_poses
        - 10trajectories_smooth/video6_lower_body_full_poses
        - 10trajectories_smooth/video7_lower_body_full_poses
        - 10trajectories_smooth/video8_lower_body_full_poses
        - 10trajectories_smooth/video9_lower_body_full_poses
        - 10trajectories_smooth/video10_lower_body_full_poses
        - 10trajectories_smooth/video1_best_smpl
        - 10trajectories_smooth/video2_best_smpl
        - 10trajectories_smooth/video3_best_smpl
        - 10trajectories_smooth/video4_best_smpl
        - 10trajectories_smooth/video5_best_smpl
        - 10trajectories_smooth/video6_best_smpl
        - 10trajectories_smooth/video7_best_smpl
        - 10trajectories_smooth/video8_best_smpl
        - 10trajectories_smooth/video9_best_smpl
        - 10trajectories_smooth/video10_best_smpl
