        - 10trajectories_smooth_stand_tail/video1_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video2_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video3_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video4_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video5_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video6_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video7_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video8_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video9_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video10_lower_body_full_poses
        - 10trajectories_smooth_stand_tail/video1_best_smpl
        - 10trajectories_smooth_stand_tail/video2_best_smpl
        - 10trajectories_smooth_stand_tail/video3_best_smpl
        - 10trajectories_smooth_stand_tail/video4_best_smpl
        - 10trajectories_smooth_stand_tail/video5_best_smpl
        - 10trajectories_smooth_stand_tail/video6_best_smpl
        - 10trajectories_smooth_stand_tail/video7_best_smpl
        - 10trajectories_smooth_stand_tail/video8_best_smpl
        - 10trajectories_smooth_stand_tail/video9_best_smpl
