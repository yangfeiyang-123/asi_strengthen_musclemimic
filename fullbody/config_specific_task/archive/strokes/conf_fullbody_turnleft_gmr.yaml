# @package _global_

defaults:
  # 继承 fullbody 的完整训练配置（环境、PPO、奖励、验证默认项）。
  - /conf_fullbody
  # 让本文件中的字段在继承后覆盖基类配置。
  - _self_

wandb:
  # W&B 项目名，用于实验分组与可视化管理。
  project: "musclemimic"
  # 默认在线记录；如果不想上传，可在命令行覆盖为 `wandb.mode=disabled`。
  mode: "online"
  # 给 turn-left 专项实验打标签，便于后续筛选。
  tags: ["fullbody", "gmr", "turnleft"]

experiment:
  task_factory:
    # ImitationFactory 会构建“按参考轨迹进行模仿”的训练环境。
    name: ImitationFactory
    params:
      amass_dataset_conf:
        # 不使用预定义数据组，改为显式指定 turn-left 轨迹列表。
        dataset_group: null
        rel_dataset_path:
          # 主训练轨迹：turn-left 的代表性动作。
          - "KIT/359/turn_left05_poses"
          # 额外的 turn-left 轨迹，用于增强同类动作内的泛化能力。
          - "KIT/314/turn_left05_poses"
          - "KIT/317/turn_left05_poses"
          - "KIT/348/turn_left05_poses"
          - "KIT/183/turn_left05_poses"
          - "KIT/425/turn_left05_poses"
          # 再补充两条不同实例/时序的 turn-left 变体，增加多样性。
          - "KIT/359/turn_left03_poses"
          - "KIT/314/turn_left03_poses"
        # 使用预先生成好的 GMR retarget cache，而不是训练时重新做 SMPL 拟合。
        retargeting_method: gmr
        gmr_config:
          # 参考人体模型类型。
          src_human: smplh
          # retarget 前将参考动作重采样到 30 FPS。
          target_fps: 30
          # GMR 内部使用的优化求解器。
          solver: daqp
          # retarget 优化中的阻尼项。
          damping: 0.5
          # 不强制把动作整体贴地，保留原始高度偏移。
          offset_to_ground: false
          # 不额外启用速度限制启发式。
          use_velocity_limit: false
          # 启用 body shape 拟合，使参考人体与机器人骨架更对齐。
          use_fitted_shape: true
          # body shape 拟合的迭代次数。
          shape_fitting_iterations: 500

  # actor 网络隐藏层结构。full-body 模仿控制较难，因此这里使用较大的 MLP。
  actor_hidden_layers: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 2048, 2048, 2048, 1024]
  # critic 网络隐藏层结构。通常与 actor 保持接近容量，以稳定价值估计。
  critic_hidden_layers: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 2048, 2048, 2048, 1024]

  validation:
    amass_dataset_conf:
      # 验证集同样显式指定 turn-left 动作，但选用未出现在训练集中的 held-out 轨迹。
      dataset_group: null
      rel_dataset_path:
        # 用于验证模型是否能泛化到相似但未参与训练的 turn-left 轨迹。
        - "KIT/317/turn_left03_poses"
        - "KIT/348/turn_left03_poses"
      # 验证时与训练保持相同的 retarget 配置，确保读取同一类 cache。
      retargeting_method: gmr
      gmr_config:
        # 与训练一致的人体模型类型。
        src_human: smplh
        # 与训练一致的 FPS 归一化设置。
        target_fps: 30
        # 与训练一致的优化求解器。
        solver: daqp
        # 与训练一致的阻尼项。
        damping: 0.5
        # 与训练一致：不强制贴地。
        offset_to_ground: false
        # 与训练一致：不额外启用速度限制。
        use_velocity_limit: false
        # 与训练一致：启用 body shape 拟合。
        use_fitted_shape: true
        # 与训练一致的 shape 拟合迭代次数。
        shape_fitting_iterations: 500
