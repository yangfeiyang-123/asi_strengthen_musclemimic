# @package _global_

defaults:
  - /conf_fullbody_gmr
  - _self_

wandb:
  project: "musclemimic"
  mode: "online"
  tags: ["fullbody", "gmr", "badminton", "source:reference_bundle"]

experiment:
  training_source:
    source_mode: reference_bundle

  env_params:
    env_name: MjxMyoFullBody
    num_envs: 256
    disable_fingers: true

  total_timesteps: 20480000

  ppo_config:
    num_steps: 80

  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: null
        rel_dataset_path:
          - "forehand_clear/insufficient_arm_extension_refbundle/001_6_23_1_-6_e7963b04"
          - "forehand_clear/insufficient_arm_extension_refbundle/002_6_23_1_-7_0d26d382"
          - "forehand_clear/insufficient_arm_extension_refbundle/003_6_23_1_-12_50cb8967"
        retargeting_method: gmr
        gmr_config:
          src_human: smplh
          target_fps: 60
          solver: daqp
          damping: 0.5
          offset_to_ground: false
          use_velocity_limit: false
          use_fitted_shape: true
          shape_fitting_iterations: 500

  validation:
    active: true
    deterministic: false
    num_steps: 500
    num_envs: 20
    num: 20
    amass_dataset_conf:
      dataset_group: null
      rel_dataset_path:
        - "forehand_clear/insufficient_arm_extension_refbundle/004_6_23_1_-15_c25aca08"
      retargeting_method: gmr
      gmr_config:
        src_human: smplh
        target_fps: 60
        solver: daqp
        damping: 0.5
        offset_to_ground: false
        use_velocity_limit: false
        use_fitted_shape: true
        shape_fitting_iterations: 500
