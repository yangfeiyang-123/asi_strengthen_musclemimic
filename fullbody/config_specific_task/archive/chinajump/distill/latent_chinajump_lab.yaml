# ChinaJump Stage-1 teacher -> reference-free latent LAB distillation.
# This action has no racket or hitting endpoint; the same numerical latent gates
# are retained so its generalization result is directly comparable.

latent_distill:
  dataset_dir: datasets/ChinaJump/distill/latent_stage1_body_optimized_qc10
  val_dataset_dir: datasets/ChinaJump/distill/latent_stage1_body_optimized_qc10_val
  expected_val_motion_count: 2
  output_dir: datasets/ChinaJump/training/latent_stage1_body_optimized_qc10
  latent_dim: 16
  hidden_layer_dims: [512, 256]
  batch_size: 256
  horizon: 8
  num_steps: 100000
  learning_rate: 0.0003
  seed: 0
  kl_weight: 0.001
  kl_warmup_steps: 10000
  free_bits: 0.0
  smooth_weight: 0.01
  bound_weight: 0.001
  action_min: -1.0
  action_max: 1.0
  sigma_min: 0.05
  sigma_max: 2.0
  log_interval: 100

  val_fraction: 0.0
  motion_field: motion_uid
  strict_motion_identity: true
  normalizer_epsilon: 0.000001
  normalizer_clip: 10.0
  max_eval_samples: 65536
  # ChinaJump has no racket/student Stage-2 branch.  The sweep's registered
  # direct decoder family is the matched latent baseline; no external racket
  # BC artifact may be borrowed from Forehand Clear.
  require_direct_bc_baseline: false
  require_closed_loop_metrics: true
  require_dataset_provenance: true
  closed_loop_tracking_metrics: [err_rpos]
  teacher_promotion_manifest: REPLACE_WITH_CHINAJUMP_STAGE1_PROMOTION_MANIFEST
  teacher_promotion_stage: stage1
  teacher_promotion_role: body_only

  action_mask:
    preset: myofullbody_finger_partition

  promotion_gates:
    max_prior_posterior_mse_ratio: 1.25
    min_active_latent_fraction: 0.25
    max_prior_sigma_min_clamp_fraction: 0.10
    max_prior_sigma_max_clamp_fraction: 0.10
    max_decoder_saturation_fraction: 0.01
    closed_loop_max_fall_or_early_termination_rate: 0.05
    closed_loop_min_lambda_025_050_no_fall_rate: 0.95
