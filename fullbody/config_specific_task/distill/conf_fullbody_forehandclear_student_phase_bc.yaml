# @package _global_

defaults:
  - /config_specific_task/conf_fullbody_badminton_gmr
  - _self_

wandb:
  tags: ["fullbody", "badminton", "forehand_clear", "distill", "student_phase_bc"]

experiment:
  algorithm: PPOJax
  normalize_env: true
  auto_resume: false
  checkpoint_dir: checkpoints/distill_forehandclear_student_phase_bc
  len_obs_history: 1
  split_goal: false

  student_obs_filter:
    enabled: true
    drop_goal_lookahead: true
    keep_motion_phase: true
    require_goal_group: true
    require_motion_phase: true

  ppo_config:
    init_std: 1.0
    learnable_std: true
