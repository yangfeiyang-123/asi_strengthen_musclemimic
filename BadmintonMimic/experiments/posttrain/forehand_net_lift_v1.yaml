experiment_id: v1
action: ForehandNetLift
family: net_frontcourt
output_root: outputs/posttrain
resume_from: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/ForehandNetLift/forehand_net_lift_best_asi_curriculum/checkpoint_7812
checkpoint_root: /data3/yangfeiyang/WorkSpace/musclemimic/outputs/posttrain/ForehandNetLift/v1/checkpoints

reference:
  train:
    - ForehandNetLift/best/video05_best_stage7_smpl
    - ForehandNetLift/best/video06_best_stage7_smpl
  validation:
    - ForehandNetLift/best/video07_best_stage5_smpl
    - ForehandNetLift/best/video08_best_stage5_smpl
  stress_test:
    - ForehandNetLift/best/video01_best_stage7_smpl
    - ForehandNetLift/best/video03_best_stage7_smpl
    - ForehandNetLift/best/video04_best_stage7_smpl
    - ForehandNetLift/best/video09_best_stage7_smpl
  excluded:
    - ForehandNetLift/best/video10_best_stage6_smpl

env:
  amass_path: /data3/yangfeiyang/WorkSpace/musclemimic/BadmintonMimic/data/amass_npz
  converted_amass_path: /data3/yangfeiyang/WorkSpace/musclemimic/caches/AMASS
  smpl_model_path: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
  matplotlib_cache: /tmp/matplotlib
  xdg_cache_home: /tmp
  xla_python_client_preallocate: false

training:
  base_config: conf_fullbody_gmr
  num_envs: 4096
  total_timesteps: 200000000
  target_fps: 100
  num_steps: 64
  update_epochs: 2
  num_minibatches: 128
  init_std: 1.0
  ent_coef: 0.0
  lr: 5.0e-5
  wandb_mode: disabled
  reset_lr_schedule_on_resume: true
  reset_logging_timestep: false
  validation_deterministic: true
  validation_num_steps: 500
  validation_num_envs: 8
  validation_num: 8
  validation_video_length: 500
  validation_video_frequency: 1
  ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json

eval:
  render_motion: ForehandNetLift/best/video05_best_stage7_smpl
  n_steps: 1000
  metrics_steps: 1
  eval_seed: 0
  stochastic: true
  no_termination: false
  record: true
  mujoco_gl: osmesa

selection_rule:
  primary: val_mean_episode_return
  constraints:
    val_root_xyz: <=0.08
    val_site_abs: <=0.16
    val_rpos: <=0.05
    val_early_termination_rate: 0

arms:
  - id: E0_baseline
    type: baseline
    description: Evaluate the current best ASI curriculum checkpoint without additional training.
    checkpoint: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/ForehandNetLift/forehand_net_lift_best_asi_curriculum/checkpoint_7812

  - id: E1_root_hand_focus
    type: posttrain
    description: Focus posttraining on forward root displacement and right-hand endpoint precision.
    reward:
      root_pos_w_sum: 0.40
      root_vel_w_sum: 0.25
      rpos_w_sum: 0.30
      qpos_w_sum: 0.04
      qvel_w_sum: 0.07
      absolute_site_reward_sites:
        - right_hand_mimic
      absolute_site_w_sum: 0.14
      absolute_site_w_exp: 12.0
    terminal:
      mean_site_deviation_threshold: 0.45
      root_deviation_threshold: 0.30
      root_orientation_threshold: 0.70
      enable_site_check: true

  - id: E2_root_hand_foot
    type: posttrain
    description: Keep E1 root/hand focus and make root/foot stability slightly stricter.
    reward:
      root_pos_w_sum: 0.42
      root_vel_w_sum: 0.28
      rpos_w_sum: 0.32
      qpos_w_sum: 0.04
      qvel_w_sum: 0.08
      absolute_site_reward_sites:
        - right_hand_mimic
      absolute_site_w_sum: 0.14
      absolute_site_w_exp: 12.0
    terminal:
      mean_site_deviation_threshold: 0.42
      root_deviation_threshold: 0.26
      root_orientation_threshold: 0.65
      enable_site_check: true

  - id: E3_smooth_control
    type: posttrain
    description: Keep E2 tracking goals but reduce overly aggressive exploration and control noise.
    training:
      init_std: 0.7
      ent_coef: 0.0
      lr: 3.0e-5
    reward:
      root_pos_w_sum: 0.40
      root_vel_w_sum: 0.26
      rpos_w_sum: 0.34
      qpos_w_sum: 0.05
      qvel_w_sum: 0.08
      absolute_site_reward_sites:
        - right_hand_mimic
      absolute_site_w_sum: 0.12
      absolute_site_w_exp: 10.0
    terminal:
      mean_site_deviation_threshold: 0.42
      root_deviation_threshold: 0.28
      root_orientation_threshold: 0.65
      enable_site_check: true
