# Stage-3 demo v6: first discover a physically replayable high-clear contact
# with a low-dimensional CEM search, then learn feedback corrections with PPO.
# The frozen forehand-clear policy remains the standard-action prior.  Only the
# right kinetic chain has explicit correction authority; the rest of the body
# may respond through the inherited policy and physics but is not given an
# independent high-authority residual.  This is the historical-baseline demo
# route, not the formal PEASD Stage-3 release.
