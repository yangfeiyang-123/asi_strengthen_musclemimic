ppo:
  total_steps: 12000000
  rollout_steps: 128
  # One genuinely on-policy update per complete 256x128 rollout.  The CEM
  # teacher supplies contact; PPO learns a small feedback delta without
  # repeatedly recycling the same batch.
  minibatch_size: 32768
  update_epochs: 1
  hidden_sizes: [256, 256]
  gamma: 0.995
  gae_lambda: 0.98
  clip_coef: 0.10
  action_std_init: 0.20
  learning_rate: 0.000005
  actor_learning_rate: 0.000005
  critic_learning_rate: 0.00030
  entropy_coef: 0.0
  max_grad_norm: 0.5
  max_abs_log_ratio: 10.0
  max_post_update_ratio_guard_fraction: 0.01
  max_post_update_kl_estimate: 0.02

stage3_direct:
  control_mode: frozen_base_residual
  # Passed explicitly by the launch script so the same immutable artifact can
  # live at a different absolute path on another machine.
