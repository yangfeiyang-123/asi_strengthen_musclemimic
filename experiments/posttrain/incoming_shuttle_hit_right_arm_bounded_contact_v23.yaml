# Stage-3 phase-A bounded contact acquisition with a frozen full-body prior.
#
# The zero-residual Stage-2 swing passes the first shuttle within 0.142 m at
# 1.89 s, so this is a small right-arm interception correction rather than a
# new whole-body skill.  v22 proved that wider dense kernels provide gradients,
# but also exposed a reward exploit: a miss accumulated more positive shaping
# than its terminal penalty.  v23 pays only improvements over each episode's
# best proximity/timing/face potential.  The total shaping is therefore capped
# at 25, below the miss penalty of 50, while any real event rebound earns at
# least 60 before return-quality terms.
runner_type: incoming_shuttle_hit
action: IncomingShuttleHitDirectResidual
experiment_id: v23_right_arm_bounded_contact
output_root: outputs/posttrain_direct_residual_right_arm_contact_v23

scene:
  xml: environment/overall_environment/assets/overall_incoming_hit_scene.xml
  build_if_missing: true
  human_root_xy: [-3.35, 0.0]

feed:
  bank_path: outputs/incoming_shuttle_hit_overhead_v3_timed/feed_bank_train.npz
  bank_size: 128
  seed: 17
  sampling_mode: calibrated_rigid_body_v3
  launch_x_range: [2.84, 3.16]
  launch_y_range: [-0.15, 0.15]
  launch_z_range: [1.83, 2.17]
  speed_range: [18.5, 21.8]
  elevation_deg_range: [57.0, 67.0]
  azimuth_jitter_deg: 0.0
  integration_dt: 0.001
  max_flight_time: 3.0
  max_attempts: 300
  net_clearance_height: 1.75
  intercept_time_range_s: [1.80, 1.96]
  intercept_vertical_velocity_range_m_s: [-7.2, -5.2]
  apex_height_range_m: [5.7, 7.1]
  target_height_tolerance_m: 0.08
  calibrated_launch_pos: [3.0, 0.0, 2.0]
  calibrated_launch_vel: [-9.45846428707787, -0.21257821761699194, 17.781968445197148]
  calibrated_intercept_time_s: 1.88
  calibrated_intercept_fraction_jitter: 0.50
  calibrated_reference_seed: 17
  calibrated_warmup_count: 16
  calibrated_position_jitter_m: [0.15, 0.14, 0.16]
  calibrated_velocity_jitter_m_s: [0.55, 0.35, 1.10]

eval_feed:
  bank_path: outputs/incoming_shuttle_hit_overhead_v3_timed/feed_bank_eval.npz
  bank_size: 64
  seed: 1017

hit_window:
  x_range: [-2.784, -2.284]
  y_range: [-0.448, 0.202]
  z_range: [1.88, 2.20]

episode:
  control_substeps: 10
  max_episode_steps: 300

return_constraints:
  net_x_m: 0.0
  net_height_m: 1.55
  min_clearance_m: 0.20
  desired_up_component: 0.75
  ballistic_score_softness_m: 0.75
  shuttle_proximity_softness_m: 0.20
  timed_intercept_softness_m: 0.20
  direction_distance_softness_m: 0.20
  contact_guidance_reward_mode: best_progress
  racket_velocity_direction_fraction: 0.15
  direction_reward_mode: positive_projection
  clearance_reward_mode: positive_score
  hit_event_mode: event_rebound
  racket_guidance_mode: inverse_impact_decomposed
  inverse_target_speed_m_s: 12.0
  inverse_velocity_softness_m_s: 7.0

reward:
  approach: 0.0
  # Each best_progress term is paid at most once in telescoping increments.
  shuttle_proximity: 10.0
  timed_intercept: 10.0
  racket_direction: 5.0
  hit_bonus: 60.0
  hit_speed: 5.0
  miss: 50.0
  return_direction: 20.0
  return_clearance: 30.0
  crossed_net: 50.0
  invalid_net_crossing: 8.0
  landing_region: 8.0
  effort: 0.002
  residual: 0.060
  posture: 3.0
  body_fall: 180.0

ppo:
  total_steps: 20000000
  rollout_steps: 64
  minibatch_size: 2048
  update_epochs: 4
  hidden_sizes: [256, 256]
  action_std_init: 0.10
  learning_rate: 0.00005
  entropy_coef: 0.00020

stage3_direct:
  control_mode: frozen_base_residual
  base_policy_artifact: null
  residual_scale: 0.25
  policy_update_mode: distal_output_head_only
  policy_trainable_actuator_names:
    - DELT1
    - DELT2
    - DELT3
    - SUPSP
    - INFSP
    - SUBSC
    - TMIN
    - TMAJ
    - PECM1
    - PECM2
    - PECM3
    - LAT1
    - LAT2
    - LAT3
    - CORB
    - TRIlong
    - TRIlat
    - TRImed
    - ANC
    - SUP
    - BIClong
    - BICshort
    - BRA
    - BRD
    - ECRL
    - ECRB
    - ECU
    - FCR
    - FCU
    - PL
    - PT
    - PQ
  freeze_observation_normalizer: true
  frozen_action_std: 0.001
  swing_phase_advance_s: 0.58
  feed_order: stored
  base_only_check:
    rollouts: 5
    steps: 220
    min_rollout_count: 5
    min_completion_rate: 1.0
    min_finite_rate: 1.0
    min_no_fall_rate: 0.95
    min_root_height_m: 0.55
    max_body_action_saturation_fraction: 0.70
    max_full_action_saturation_fraction: 0.70
    max_normalized_control_energy: 0.80
    min_control_finite: 1.0
    max_attachment_translation_drift_m: 0.005
    max_attachment_rotation_drift_rad: 0.05
  curriculum:
    enabled: true
    fixed_feed_steps: 250000
    jitter_feed_count: 16
    jitter_expand_steps: 2000000
    full_bank_expand_steps: 8000000
    gate_min_completed_episodes: 1024
    gate_window_iterations: 20
    gate_min_no_fall_rate: 0.95
    fixed_min_hit_rate: 0.20
    fixed_min_crossed_net_rate: 0.0
    jitter_min_hit_rate: 0.35
    jitter_min_crossed_net_rate: 0.05
    full_bank_min_hit_rate: 0.55
    full_bank_min_crossed_net_rate: 0.30

stage3_lab:
  enabled: false
  filter_finger_observation: false
  swing_duration_s: 1.2
  contact_phase: 0.76
  hand_fixture:
    mode: removed
    policy_enabled: false
    observations_enabled: false
  racket_attachment:
    mode: exact_child
    contract_path: configs/racket_attachment/forehand_clear_rigid_v4_custom.json
    hand_racket_contact_enabled: false

evaluation:
  heldout_feed_count: 64
  promotion_gates:
    min_no_fall_rate: 0.95
    min_hit_rate: 0.65
    min_crossed_net_rate: 0.50
    min_opponent_back_landing_rate: 0.30
    min_racket_head_speed_m_s: 8.0
    min_net_clearance_m: 0.20
    max_body_action_saturation_fraction: 0.70
    max_full_action_saturation_fraction: 0.70
    max_normalized_control_energy: 0.80
    min_control_finite: 1.0
    min_root_height_m: 0.55
    max_attachment_translation_drift_m: 0.005
    max_attachment_rotation_drift_rad: 0.05
