experiment_id: v1
action: ForehandNetLift
family: net_frontcourt
output_root: outputs/posttrain
resume_from: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/ForehandNetLift/forehand_net_lift_best_asi_curriculum/checkpoint_7812
checkpoint_root: /data3/yangfeiyang/WorkSpace/musclemimic/outputs/posttrain/ForehandNetLift/v1/checkpoints
reference:
  train:
  - ForehandNetLift/best/video05_best_stage7_smpl
  - ForehandNetLift/best/video06_best_stage7_smpl
  - ForehandNetLift/best/video07_best_stage5_smpl
  - ForehandNetLift/best/video08_best_stage5_smpl
  validation:
  - ForehandNetLift/best/video01_best_stage7_smpl
  - ForehandNetLift/best/video03_best_stage7_smpl
  stress_test:
  - ForehandNetLift/best/video04_best_stage7_smpl
  - ForehandNetLift/best/video09_best_stage7_smpl
  excluded:
  - ForehandNetLift/best/video10_best_stage6_smpl
env:
  amass_path: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/amass_npz
  converted_amass_path: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/gmr_cache
  gmr_cache_path: /data3/yangfeiyang/WorkSpace/musclemimic/datasets/forehandLift/muscle_trajectory/gmr_cache
  smpl_model_path: /data3/yangfeiyang/WorkSpace/musclemimic/smpl_models/smplh
  matplotlib_cache: /tmp/matplotlib
  xdg_cache_home: /tmp
  xla_python_client_preallocate: false
training:
  base_config: conf_fullbody_gmr
  num_envs: 4096
  total_timesteps: 200000000
  target_fps: 100
  num_steps: 64
  update_epochs: 2
  num_minibatches: 128
  init_std: 1.0
  ent_coef: 0.0
  lr: 5.0e-05
  wandb_mode: online
  reset_lr_schedule_on_resume: true
  reset_logging_timestep: false
  validation_deterministic: true
  validation_num_steps: 500
  validation_num_envs: 8
  validation_num: 8
  validation_video_length: 500
  validation_video_frequency: 1
  validation_start_from_beginning: true
  ik_config_path: loco_mujoco/smpl/gmr_configs/smplh_to_myofullbody_smooth_train.json
eval:
  render_motion: ForehandNetLift/best/video05_best_stage7_smpl
  n_steps: 1000
  metrics_steps: 1
  eval_seed: 0
  stochastic: false
  start_from_beginning: true
  no_termination: false
  record: true
  mujoco_gl: osmesa
selection_rule:
  primary: val_mean_episode_return
  constraints:
    val_early_termination_rate: 0
    val_frame_coverage: '>=0.95'
    val_err_joint_vel: <=0.90
    val_rpos: <=0.06
arms:
- id: E0_baseline
  type: baseline
  description: Evaluate the current best ASI curriculum checkpoint without additional
    training.
  checkpoint: /data3/yangfeiyang/WorkSpace/musclemimic/checkpoints/ForehandNetLift/forehand_net_lift_best_asi_curriculum/checkpoint_7812
- id: E1c_fullbody_stability
  type: posttrain
  description: 'Best current ForehandNetLift posttrain arm: train on four reference
    motions and prioritize full-body stability before root/hand refinement.'
  training:
    lr: 5.0e-06
    init_std: 0.55
    reset_std_on_resume: 0.25
    ent_coef: 0.0
  reward:
    root_pos_w_sum: 0.26
    root_vel_w_sum: 0.26
    rpos_w_sum: 0.38
    qpos_w_sum: 0.06
    qvel_w_sum: 0.18
    rquat_w_sum: 0.07
    rvel_w_sum: 0.08
    absolute_site_reward_sites:
    - right_hand_mimic
    absolute_site_w_sum: 0.06
    absolute_site_w_exp: 8.0
  terminal:
    mean_site_deviation_threshold: 0.45
    root_deviation_threshold: 0.3
    root_orientation_threshold: 0.7
    enable_site_check: true
- id: E2a_low_lr_control
  type: posttrain
  description: Low-learning-rate control for checking whether conservative resume alone
    fixes PostTrain drift.
  training:
    lr: 2.0e-06
    init_std: 0.55
    reset_std_on_resume: 0.25
    ent_coef: 0.0
  reward:
    root_pos_w_sum: 0.26
    root_vel_w_sum: 0.26
    rpos_w_sum: 0.38
    qpos_w_sum: 0.06
    qvel_w_sum: 0.18
    rquat_w_sum: 0.07
    rvel_w_sum: 0.08
    absolute_site_reward_sites:
    - right_hand_mimic
    absolute_site_w_sum: 0.06
    absolute_site_w_exp: 8.0
  terminal:
    mean_site_deviation_threshold: 0.45
    root_deviation_threshold: 0.3
    root_orientation_threshold: 0.7
    enable_site_check: true
- id: E2c_baseline_hinge_anchor
  type: posttrain
  description: Baseline-preserving micro-finetune with a hinge action-mean anchor to
    test whether long-term policy drift is the main failure mode.
  training:
    lr: 2.0e-06
    init_std: 0.55
    reset_std_on_resume: 0.25
    ent_coef: 0.0
  policy_anchor:
    enabled: true
    type: hinge_action_mse
    coeff: 0.003
    margin: 0.02
  reward:
    root_pos_w_sum: 0.26
    root_vel_w_sum: 0.26
    rpos_w_sum: 0.38
    qpos_w_sum: 0.06
    qvel_w_sum: 0.18
    rquat_w_sum: 0.07
    rvel_w_sum: 0.08
    absolute_site_reward_sites:
    - right_hand_mimic
    absolute_site_w_sum: 0.06
    absolute_site_w_exp: 8.0
  terminal:
    mean_site_deviation_threshold: 0.45
    root_deviation_threshold: 0.3
    root_orientation_threshold: 0.7
    enable_site_check: true
- id: E3a_dynamics_first
  type: posttrain
  description: Dynamics-first survival stage. Lower hand/root-position pressure and
    prioritize velocity consistency so heldout motions remain alive before hand refinement.
  training:
    lr: 1.0e-06
    total_timesteps: 100000000
    init_std: 0.35
    reset_std_on_resume: 0.15
    ent_coef: 0.0
  reward:
    root_pos_w_sum: 0.2
    root_vel_w_sum: 0.34
    rpos_w_sum: 0.28
    qpos_w_sum: 0.04
    qvel_w_sum: 0.28
    rquat_w_sum: 0.08
    rvel_w_sum: 0.14
    absolute_site_reward_sites:
    - right_hand_mimic
    absolute_site_w_sum: 0.01
    absolute_site_w_exp: 6.0
  terminal:
    mean_site_deviation_threshold: 0.55
    root_deviation_threshold: 0.38
    root_orientation_threshold: 0.9
    enable_site_check: true
  validation_terminal:
    mean_site_deviation_threshold: 0.45
    root_deviation_threshold: 0.3
    root_orientation_threshold: 0.7
    enable_site_check: true
- id: E3b_dynamics_first_linear_anchor
  type: posttrain
  description: Dynamics-first survival stage with an active linear baseline action-mean
    anchor to reduce long-term policy drift while preserving full-motion coverage.
  training:
    lr: 1.0e-06
    total_timesteps: 100000000
    init_std: 0.35
    reset_std_on_resume: 0.15
    ent_coef: 0.0
  policy_anchor:
    enabled: true
    type: linear_hinge_action_mse
    coeff: 0.05
    margin: 5.0e-04
  reward:
    root_pos_w_sum: 0.2
    root_vel_w_sum: 0.34
    rpos_w_sum: 0.28
    qpos_w_sum: 0.04
    qvel_w_sum: 0.28
    rquat_w_sum: 0.08
    rvel_w_sum: 0.14
    absolute_site_reward_sites:
    - right_hand_mimic
    absolute_site_w_sum: 0.01
    absolute_site_w_exp: 6.0
  terminal:
    mean_site_deviation_threshold: 0.55
    root_deviation_threshold: 0.38
    root_orientation_threshold: 0.9
    enable_site_check: true
  validation_terminal:
    mean_site_deviation_threshold: 0.45
    root_deviation_threshold: 0.3
    root_orientation_threshold: 0.7
    enable_site_check: true
