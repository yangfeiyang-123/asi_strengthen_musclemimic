[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-trigno-emg"
version = "1.2.0"
description = "Versioned Delsys Trigno EMG acquisition and muscle-synergy workflow"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.scripts]
badminton-emg = "emg.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
include = ["emg*"]
