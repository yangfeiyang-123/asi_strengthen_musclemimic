# @package _global_
#
# STAGE 2 — fingerless rigid-racket adaptation on canonical raw_smooth_v1 22/5
# split as Stage 1.  qpos/qvel/observation/action dimensions are unchanged, so a
# completed Stage-1 body checkpoint can be supplied with experiment.resume_from.
#
# Production launch from the accepted Stage-1 checkpoint:
#   ... experiment.resume_from=<stage1-checkpoint> \
#       experiment.reset_lr_schedule_on_resume=true

defaults:
  - /config_specific_task/base/conf_fullbody_badminton_racket_gmr
  - _self_

wandb:
  name: forehand_clear_raw_smooth_v1_22_stage2_racket_v1
  tags: ["fullbody", "badminton", "forehand_clear", "stage2", "racket",
         "raw_smooth_v1", "train22_val5"]

experiment:
  run_id: forehand_clear_raw_smooth_v1_22_stage2_racket_v1
  resume_from: null
  parent_checkpoint_lineage:
    required: true
    role: stage1_promoted
  reset_lr_schedule_on_resume: true
  reset_std_on_resume: 0.5
  strict_auto_resume_config_hash: true

  validation:
    cover_all_trajectories: true
    # Generates five racket-aware held-out candidates before numerical stop.
    visual_review_kind: stage2_racket

  # Stage 2 is an adaptation from an accepted 354-action Stage-1 checkpoint,
  # not a second full Stage-1 run.  The PPO runner interprets this as 80M
  # additional environment transitions after resume.  Extend explicitly to
  # 160M only while held-out racket metrics are still improving.
  total_timesteps: 80000000

  promotion:
    stage: stage2
    auto_stop: true
    consecutive_validations: 3
    min_validations_before_stop: 5
    progress_path: null
    # Required for the <=10% body-degradation gate.  The canonical pipeline
    # injects the accepted Stage-1 validation JSON; manual launches must supply
    # experiment.promotion.baseline_metrics_path=<stage1-metrics.json>.
    baseline_metrics_path: null
    max_early_termination_rate: 0.05
    min_frame_coverage: 0.95
    max_racket_position_error_m: 0.05
    max_racket_rotation_error_rad: 0.20
    max_body_metric_relative_degradation: 0.10
